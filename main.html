<html>

<head>
	<title>WebGL - Canvas test</title>
	<meta http-equiv="content-type" content="text/html; charset=ISO-8859-1">

	<script type="text/javascript" src="glMatrix.js"></script>
	<script type="text/javascript" src="callbacks.js"></script>
	<script type="text/javascript" src="glCourseBasis.js"></script>
	<script type="text/javascript" src="objLoader.js"></script>

<!--</head> !-->

	<style>
		.main-container {
			display: flex;
			flex-direction: row;
			align-items: flex-start;
			gap: 15px;
		}

		.controls-panel {
			display: flex;
			flex-direction: column;
			gap: 10px;
			width: 180px;
		}

		.controls-panel button {
			padding: 10px 15px;
			font-size: 14px;
			cursor: pointer;
			background-color: #8d47bf;
			color: white;
			border: none;
			border-radius: 4px;
			transition: background-color 0.2s;
		}

		.controls-panel button:hover {
			background-color: #8d47bf;
		}

		.slider-group {
			display: flex;
			flex-direction: column;
			gap: 5px;
		}

		.slider-group label {
			font-size: 14px;
			font-weight: bold;
		}

		.slider-group input[type="range"] {
			width: 100%;
			cursor: pointer;
		}

		.slider-value {
			font-size: 13px;
			color: #555;
		}
	</style>
</head>

<body onload="webGLStart();">

<!--test css Gemini !-->

<div class="main-container">

	<canvas id="WebGL-test" style="border:none;" width="800" height="600"></canvas>

	<div class="controls-panel">
		<h3>Commandes</h3>
		<button onclick="console.log('Action 1')">[inserer action]</button>
		<button onclick="console.log('Action 2')">[inserer action]</button>
		<button onclick="console.log('Action 3')">[inserer action]</button>

		<label for="speedSlider">Hauteur :</label>
		<input
				type="range"
				id="speedSlider"
				min="0"
				max="100"
				value="50"
				step="1"
				oninput="updateSliderValue(this.value)"
		>
		<span class="slider-value">Valeur : <strong id="speedValue">50</strong></span>

	</div>

</div>

</body>

</html>
