<html>

<head>
	<title>WebGL - Canvas test</title>
	<meta http-equiv="content-type" content="text/html; charset=ISO-8859-1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script type="text/javascript" src="glMatrix.js"></script>
	<script type="text/javascript" src="callbacks.js"></script>
	<script type="text/javascript" src="glCourseBasis.js"></script>
	<script type="text/javascript" src="objLoader.js"></script>

</head>

<body class="bg-dark text-light p-4" onload="webGLStart();">
  <div class="container-fluid">
    <div class="row g-4 align-items-start">
	  <div class="alert alert-info py-1 px-2 small mt-2 mb-0">
		Astuce : Maintenez <strong>Shift + Clic glissé</strong> sur le canvas pour déplacer le soleil.
	  </div>
      <div class="col-auto">
        <div class="card shadow-lg bg-black border-secondary p-1">
          <canvas id="WebGL-test" class="rounded" width="800" height="600"></canvas>
        </div>
      </div>
	  <div class="col">
		<div class="row">

		<!-- PARAMETRE TERRAIN -->

		<div class="col-6">
        <div class="card bg-secondary bg-opacity-25 border-secondary shadow p-3 text-light mb-2">
          <h5 class="card-title pb-2 border-bottom border-secondary mb-3">Paramètres du Terrain</h5>

          <div class="mb-3">
            <label class="form-label text-secondary fw-semibold small text-uppercase">Affichage</label>
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" role="switch" id="landDisplay">
              <label class="form-check-label" for="textureActivation">Afficher</label>
            </div>
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" role="switch" id="wireframeSwitch">
              <label class="form-check-label" for="wireframeSwitch">Fil de fer</label>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="textureActivation">
              <label class="form-check-label" for="textureActivation">Texture active</label>
            </div>
          </div>

          <div class="mb-3">
            <label for="terrainSelect" class="form-label text-secondary fw-semibold small text-uppercase">Height Map</label>
            <select id="terrainSelect" class="form-select bg-dark text-light border-secondary">
              <option value="heightmap/texture1.png">Cailloux</option>
              <option value="heightmap/texture2.png" selected>Montagnes</option>
              <option value="heightmap/texture3.png">Volcan</option>
            </select>

          <div class="mb-2">
            <label for="textureSelect" class="form-label text-secondary fw-semibold small text-uppercase">Texture</label>
            <select id="textureSelect" class="form-select bg-dark text-light border-secondary">
              <option value="texture/snow.jpg" selected>Neige</option>
              <option value="texture/stone.png">Pierre</option>
            </select>
          </div>

        </div>
      </div>

    </div>

	<!-- PARAMETRE RIVIERE -->

	<div class="col-6">
        <div class="card bg-secondary bg-opacity-25 border-secondary shadow p-3 text-light">
          <h5 class="card-title pb-2 border-bottom border-secondary mb-3">Paramètres de la rivière</h5>

          <div class="mb-3">
            <label class="form-label text-secondary fw-semibold small text-uppercase">Affichage</label>
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" role="switch" id="waterDisplay">
              <label class="form-check-label" for="textureActivation">Afficher</label>
            </div>
          </div>

          <div class="mb-3">
            <label for="waterTextureSelect" class="form-label text-secondary fw-semibold small text-uppercase">Texture Eau</label>
            <select id="waterTextureSelect" class="form-select bg-dark text-light border-secondary">
              <option value="river.jpg" selected>Rivière</option>
              <option value="ocean.jpg">Océan</option>
              <option value="sea.jpg">Mer</option>
            </select>
          </div>

          <div class="mb-2">
            <label for="waterBumMapSelect" class="form-label text-secondary fw-semibold small text-uppercase">Bum Map Eau</label>
            <select id="waterBumMapSelect" class="form-select bg-dark text-light border-secondary">
              <option value="river_normal.jpg" selected>Rivière</option>
              <option value="ocean_normal.jpg">Océan</option>
              <option value="sea_normal.jpg">Mer</option>
            </select>
          </div>

        </div>
      </div>

	  <!-- PARAMETRE OBJ -->

	  <div class="col-6">
        <div class="card bg-secondary bg-opacity-25 border-secondary shadow p-3 text-light">
          <h5 class="card-title pb-2 border-bottom border-secondary mb-3">Paramètres des .obj</h5>

          <div class="mb-3">
            <label class="form-label text-secondary fw-semibold small text-uppercase">Affichage</label>
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" role="switch" id="objDisplay">
              <label class="form-check-label" for="objActivation">Afficher</label>
            </div>
          </div>

          <div class="mb-3">
            <label for="objSelect" class="form-label text-secondary fw-semibold small text-uppercase">Terrain</label>
            <select id="objSelect" class="form-select bg-dark text-light border-secondary">
              <option value="bunny.obj" selected >Lapin</option>
              <option value="sphere.obj">Sphere</option>
			  <option value="porsche.obj">Porshe</option>
			  <option value="mustang.obj">Mustang</option>
            </select>
        </div>
      </div>

    </div>

    </div>
		</div>
		</div>
  </div>
</body>


</html>
